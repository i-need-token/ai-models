<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page Not Found — AI Models Catalog</title>
    <style>
      :root {
        --bg: #0d1117;
        --surface: #161b22;
        --border: #30363d;
        --text: #e6edf3;
        --text-secondary: #8b949e;
        --accent: #58a6ff;
      }
      @media (prefers-color-scheme: light) {
        :root {
          --bg: #ffffff;
          --surface: #f6f8fa;
          --border: #d0d7de;
          --text: #1f2328;
          --text-secondary: #656d76;
          --accent: #0969da;
        }
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
        background: var(--bg);
        color: var(--text);
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
        padding: 20px;
      }
      .container {
        text-align: center;
        max-width: 480px;
      }
      h1 {
        font-size: 72px;
        margin: 0;
        color: var(--accent);
      }
      h2 {
        font-size: 20px;
        margin: 8px 0 16px;
        font-weight: 400;
        color: var(--text-secondary);
      }
      p {
        color: var(--text-secondary);
        line-height: 1.6;
        margin: 0 0 24px;
      }
      a {
        color: var(--accent);
        text-decoration: none;
        padding: 10px 24px;
        border: 1px solid var(--accent);
        border-radius: 8px;
        display: inline-block;
        transition: all 0.2s;
      }
      a:hover {
        background: var(--accent);
        color: #fff;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>404</h1>
      <h2>Model not found</h2>
      <p>
        This page doesn't exist in the AI Models Catalog. Maybe the model was deprecated, or the URL
        is incorrect.
      </p>
      <a href="/">← Back to Catalog</a>
    </div>
  </body>
</html>
